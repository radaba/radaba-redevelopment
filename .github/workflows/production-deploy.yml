name: Production deployment
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: radaba-production
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main or semantic release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then exit 0; fi
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  package:
    needs: authorize
    runs-on: ubuntu-latest
    environment: production
    env:
      CI: "true"
      RADABA_ENV: production
      NODE_ENV: production
      APP_URL: ${{ vars.APP_URL }}
      APP_VERSION: ${{ github.ref_name }}
      BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ vars.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run env:check
      - run: npm run build
      - run: tar -czf radaba-${{ github.sha }}.tgz .next/standalone .next/static public package.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-radaba-${{ github.sha }}
          path: radaba-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 30
  deploy:
    needs: package
    runs-on: [self-hosted, production]
    environment: production
    env:
      RADABA_ENV: production
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_ID: ${{ github.sha }}
      EXPECTED_ENVIRONMENT_FINGERPRINT: ${{ vars.ENVIRONMENT_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-radaba-${{ github.sha }}
      - name: Require approved release adapters
        run: test -x /opt/radaba/bin/deploy-release && test -x /opt/radaba/bin/backup-release
      - name: Verify target fingerprint
        run: /opt/radaba/bin/environment-fingerprint --expect "$EXPECTED_ENVIRONMENT_FINGERPRINT"
      - name: Complete pre-deploy backup
        run: /opt/radaba/bin/backup-release production "$RELEASE_TAG"
      - name: Deploy immutable release
        run: /opt/radaba/bin/deploy-release production "$RELEASE_COMMIT" "$RELEASE_TAG" "radaba-$RELEASE_COMMIT.tgz"
      - name: Post-deploy smoke tests
        env:
          SMOKE_BASE_URL: ${{ vars.APP_URL }}
        run: node scripts/smoke-test.mjs
